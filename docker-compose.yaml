services:
  automatekit-web:
    image: ${DOCKER_USERNAME}/automatekit-web:latest
    container_name: automatekit-web
    restart: always
    ports:
      - "3000:80"
    env_file:
      - .env
    networks:
      - automatekit-network

  automatekit-server:
    image: ${DOCKER_USERNAME}/automatekit-server:latest
    container_name: automatekit-server
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - automatekit-network

  automatekit-executor:
    image: ${DOCKER_USERNAME}/automatekit-executor:latest
    container_name: automatekit-executor
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - automatekit-network

  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:16-alpine
    container_name: automatekit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - automatekit-network

  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:7-alpine
    container_name: automatekit-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - automatekit-network

volumes:
  postgres_data:
  redis_data:

networks:
  automatekit-network:
    driver: bridge
