services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_APP_BASE_URL: ${VITE_APP_BASE_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: ${IMAGE_PREFIX:-automatekit}/automatekit-web:${IMAGE_TAG:-local}
    container_name: automatekit-web
    restart: always
    ports:
      - '${WEB_PORT:-3000}:80'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - automatekit

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: ${IMAGE_PREFIX:-automatekit}/automatekit-server:${IMAGE_TAG:-local}
    container_name: automatekit-server
    restart: always
    ports:
      - '${SERVER_PORT:-8000}:8000'
    env_file:
      - .env
    # Wait until the datastores accept connections, not merely until created.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - automatekit

  executor:
    build:
      context: .
      dockerfile: docker/Dockerfile.executor
    image: ${IMAGE_PREFIX:-automatekit}/automatekit-executor:${IMAGE_TAG:-local}
    container_name: automatekit-executor
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automatekit

  postgres:
    image: postgres:16-alpine
    container_name: automatekit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - automatekit_postgres_data:/var/lib/postgresql/data
    networks:
      - automatekit

  redis:
    image: redis:7-alpine
    container_name: automatekit-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - automatekit_redis_data:/data
    networks:
      - automatekit

volumes:
  automatekit_postgres_data:
  automatekit_redis_data:

networks:
  automatekit:
    driver: bridge
