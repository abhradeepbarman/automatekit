services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: automatekit-web:local
    container_name: automatekit-web
    restart: always
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      - server
    networks:
      - automatekit

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: automatekit-server:local
    container_name: automatekit-server
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - automatekit

  executor:
    build:
      context: .
      dockerfile: docker/Dockerfile.executor
    image: automatekit-executor:local
    container_name: automatekit-executor
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - automatekit

  postgres:
    image: postgres:16-alpine
    container_name: automatekit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - automatekit_postgres_data:/var/lib/postgresql/data
    networks:
      - automatekit

  redis:
    image: redis:7-alpine
    container_name: automatekit-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - automatekit_redis_data:/data
    networks:
      - automatekit

volumes:
  automatekit_postgres_data:
  automatekit_redis_data:

networks:
  automatekit:
    driver: bridge
